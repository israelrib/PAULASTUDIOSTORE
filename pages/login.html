<!DOCTYPE html>
<html lang="pt-BR">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title id="page-title"></title>

    <link rel="stylesheet" href="/style/produto.css">

</head>

<body>

    <!-- ========================= -->
    <!-- HEADER -->
    <!-- ========================= -->

    <header id="header">

        <div class="container">

            <div class="logo">

                <img id="logo-img" src="" alt="">

                <span id="logo-text"></span>

            </div>

            <nav>

                <ul class="menu">

                    <li><a id="menu-login" href="#"></a></li>

                    <li><a id="menu-cadastro" href="#"></a></li>

                    <li><a id="menu-ajuda" href="#"></a></li>

                </ul>

            </nav>

        </div>

    </header>

    <!-- ========================= -->
    <!-- MAIN -->
    <!-- ========================= -->

    <main>

        <!-- HERO -->

        <section id="hero">

            <div class="container hero-container">

                <div class="hero-info">

                    <h1 id="hero-title"></h1>

                    <p id="hero-description"></p>

                    <div class="hero-buttons">

                        <button id="btn-criar-conta"></button>

                        <button id="btn-ir-login"></button>

                    </div>

                </div>

                <div class="hero-logo">

                    <img id="hero-image" src="" alt="">

                </div>

            </div>

        </section>

        <!-- LOGIN -->

        <section id="login">

            <div class="container">

                <div class="login-header">

                    <h2 id="login-title"></h2>

                    <p id="login-description"></p>

                </div>

                <form id="form-login">

                    <div class="form-group">

                        <label id="label-email" for="email"></label>

                        <input
                            id="email"
                            type="email"
                            placeholder=""
                        >

                    </div>

                    <div class="form-group">

                        <label id="label-password" for="password"></label>

                        <input
                            id="password"
                            type="password"
                            placeholder=""
                        >

                    </div>

                    <div class="buttons-login">

                        <button
                            type="button"
                            id="btn-forgot-password">
                        </button>

                        <button
                            type="submit"
                            id="btn-login">
                        </button>

                    </div>

                </form>

            </div>

        </section>

        <!-- LOGIN SOCIAL -->

        <section id="social-login">

            <div class="container">

                <h2 id="social-title"></h2>

                <p id="social-description"></p>

                <div class="social-cards">

                    <article class="social-card">

                        <img id="google-icon" src="" alt="">

                        <h3 id="google-title"></h3>

                        <p id="google-description"></p>

                        <button id="btn-google"></button>

                    </article>

                    <article class="social-card">

                        <img id="microsoft-icon" src="" alt="">

                        <h3 id="microsoft-title"></h3>

                        <p id="microsoft-description"></p>

                        <button id="btn-microsoft"></button>

                    </article>

                </div>

            </div>

        </section>

        <!-- CRIAR CONTA -->

        <section id="account">

            <div class="container">

                <h2 id="account-title"></h2>

                <p id="account-description"></p>

                <div class="account-buttons">

                    <button id="btn-open-login"></button>

                    <button id="btn-open-register"></button>

                </div>

            </div>

        </section>

        <!-- CADASTRO -->

        <section id="register"> <!-- Adicionei o comentário para indicar que esta seção é para cadastro -->

            <div class="container">

                <h2 id="register-title"></h2>

                <p id="register-description"></p>

                <form id="form-register">

                    <div class="grid-form">

                        <div class="form-group">

                            <label id="label-name" for="name"></label>

                            <input
                                id="name"
                                type="text"
                                placeholder=""
                            >

                        </div>

                        <div class="form-group">

                            <label id="label-register-email" for="register-email"></label>

                            <input
                                id="register-email"
                                type="email"
                                placeholder=""
                            >

                        </div>

                        <div class="form-group">

                            <label id="label-register-password" for="register-password"></label>

                            <input
                                id="register-password"
                                type="password"
                                placeholder=""
                            >

                        </div>

                        <div class="form-group">

                            <label id="label-confirm-password" for="confirm-password"></label>

                            <input
                                id="confirm-password"
                                type="password"
                                placeholder=""
                            >

                        </div>

                    </div>

                    <div class="register-buttons">

                        <button
                            type="button"
                            id="btn-back">
                        </button>

                        <button
                            type="submit"
                            id="btn-register">
                        </button>

                    </div>

                </form>

            </div>

        </section>

    </main>

    <!-- ========================= -->
    <!-- FOOTER -->
    <!-- ========================= -->

    <footer id="footer">

        <div class="container footer-content">

            <p id="footer-copy"></p>

            <a id="footer-policy" href="#"></a>

            <a id="footer-terms" href="#"></a>

            <a id="footer-contact" href="#"></a>

        </div>

    </footer>

    <script src="/js/pedidos.js"></script>

</body>

</html>
