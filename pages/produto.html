<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Produto</title>
    <!--conexão com CSS-->
    <link rel="stylesheet" href="/style/produto.css">
    <!--logo da empresa para o navegador-->
    <link rel="icon" type="image/png" href="/assets/logonavegador.png">
</head>
<body>
    <!-- CABEÇALHO -->
    <header class="menu">
        <div class="topo">
                <!-- LOGO -->
                <div class="logo">
                    <img src="/assets/logo.png" alt="Logo da Paula Studio Store">
                    
                </div>
                <!-- CAIXA DE PESQUISA-->
                <div class="caixa-pesquisa">
                    <input type="text" placeholder="Digite o que você procura...">
                    <img src="/assets/lupa.png" alt="Ícone de pesquisa">
                 
                </div>

                <!-- ÍCONES -->
                 <div class="icones">
                    <a href="">
                        <img src="/assets/user.png" alt="login">
                        <small>Olá, visitante</small>
                        <p>ENTRAR</p>
                    </a>
                    <a href="">
                        <img src="/assets/carrinho.png" alt="carrinho">
                        <small>Meu</small>
                        <p>CARRINHO</p>
                    </a>
                    
                 </div>

        </div>

        <nav class="menu">
            <a id="idacesso" href="#">ACESSO</a>
            <a href="#">HOME</a>
            <a href="#">MEUS PEDIDOS</a>
            <a href="#">PERFIL</a>
            <a href="#">SAIR</a>
            <a href="#">CARRINHO</a>
       
        </nav>
    </header>
    <!--AREA DOS DADOS DO PRODUTO-->
    <div class="area-detalhes">
        <div class="area-imagens">
            <div class="img-lateral" id="img-lateral">
                <!--não criamos tag img aqui porque não temos como
                saber a quantidade de imagens que o lojista vai
                cadastrar-->

            </div>
            <div class="img-principal" id="img-principal">
                <img id="imagem-maior">

            </div>
        </div>
        <div class="area-textos">
            <!--nome do produto-->
            <h1 id="nome-produto"></h1>
            <!--área das avaliações do produto-->
            <div class="avaliacoes-produto">
                <img id="estrela-avaliacao">
                <span id="valor-avaliacao"></span>
            </div>
            <p id="preco-antigo"></p>
            <!--area do preço promocional-->
            <div class="preco-promocional">
                <p id="preco-promocional"></p>
                <span id="desconto"></span>
            </div>
            <div id="tamanhos"></div>
            <div id="cores"></div>
            <div class="quantidade">
                <button id="diminuir">-</button>
                <span id="numero-quantidade"></span>
                <button id="aumentar">+</button>
            </div>
            <div class="btn-add-carrinho">
                <button id="bnt-add-carrinho"></button>
            </div>
            <div class="btn-comprar">
                <button id="btn-comprar"></button>
            </div>
            <div class="area-frete">
                <p>Calcular o Frete</p>
                <input id="frete">
                <button id="btn-calcular-frete">Calcular</button>
            </div>

        </div>

    </div>
    <!--FAZENDO A CONEXÃO COM O JAVASCRIPT-->
    <script src="/js/produto.js"></script>
</body>

</html>
