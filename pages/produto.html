<!DOCTYPE html>
<html lang="pt-br">
<head>

    <title>Produto</title>
    <!--conexão com CSS-->

                    </a>
                    <a href="">
                        <img src="/assets/carrinho.png" alt="carrinho">

                    </a>
                    
                 </div>

        </div>

        <nav class="menu">
            <a id="idacesso" href="#">ACESSO</a>

            <a href="#">PERFIL</a>

     <div class="area-detalhes">

            </div>

            </div>
        </div>
