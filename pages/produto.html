<!DOCTYPE html>
<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Produto | Paula Studio Store</title>

    <!-- Conexão com o CSS -->
    <link
        rel="stylesheet"
        href="/style/produto.css"
    >

    <!-- Logo da empresa na aba do navegador -->
    <link
        rel="icon"
        type="image/png"
        href="/assets/logonavegador.png"
    >

</head>

<body>

    <!-- ==========================================
         CABEÇALHO
    =========================================== -->

    <header class="menu">

        <div class="topo">

            <!-- LOGO -->

            <div class="logo">

                <img
                    src="/assets/logo.png"
                    alt="Logo da Paula Studio Store"
                >

            </div>

            <!-- CAIXA DE PESQUISA -->

            <div class="caixa-pesquisa">

                <input
                    type="text"
                    id="campo-pesquisa"
                    placeholder="Digite o que você procura..."
                >

                <img
                    src="/assets/lupa.png"
                    alt="Ícone de pesquisa"
                >

            </div>

            <!-- ÍCONES -->

            <div class="icones">

                <a href="/pages/login.html">

                    <img
                        src="/assets/user.png"
                        alt="Acessar conta"
                    >

                    <small>Olá, visitante</small>

                    <p>ENTRAR</p>

                </a>

                <a href="/pages/carrinho.html">

                    <img
                        src="/assets/carrinho.png"
                        alt="Abrir carrinho"
                    >

                    <small>Meu</small>

                    <p>CARRINHO</p>

                </a>

            </div>

        </div>

        <nav class="menu-navegacao">

            <a
                id="idacesso"
                href="/pages/login.html"
            >
                ACESSO
            </a>

            <a href="/index.html">
                HOME
            </a>

            <a href="/pages/pedidos.html">
                MEUS PEDIDOS
            </a>

            <a href="/pages/perfil.html">
                PERFIL
            </a>

            <a href="/pages/login.html">
                SAIR
            </a>

            <a href="/pages/carrinho.html">
                CARRINHO
            </a>

        </nav>

    </header>

    <!-- ==========================================
         CONTEÚDO PRINCIPAL
    =========================================== -->

    <main class="pagina-produto">

        <section class="area-detalhes">

            <!-- ==================================
                 GALERIA DE IMAGENS
            =================================== -->

            <div class="area-imagens">

                <!-- MINIATURAS -->

                <div
                    class="img-lateral"
                    id="img-lateral"
                >

                    <button
                        type="button"
                        class="miniatura ativa"
                        id="miniatura-1"
                        data-indice="0"
                        aria-label="Visualizar primeira imagem"
                    >

                        <img
                            id="imagem-miniatura-1"
                            src=""
                            alt="Miniatura do produto 1"
                        >

                    </button>

                    <button
                        type="button"
                        class="miniatura"
                        id="miniatura-2"
                        data-indice="1"
                        aria-label="Visualizar segunda imagem"
                    >

                        <img
                            id="imagem-miniatura-2"
                            src=""
                            alt="Miniatura do produto 2"
                        >

                    </button>

                    <button
                        type="button"
                        class="miniatura"
                        id="miniatura-3"
                        data-indice="2"
                        aria-label="Visualizar terceira imagem"
                    >

                        <img
                            id="imagem-miniatura-3"
                            src=""
                            alt="Miniatura do produto 3"
                        >

                    </button>

                    <button
                        type="button"
                        class="miniatura"
                        id="miniatura-4"
                        data-indice="3"
                        aria-label="Visualizar quarta imagem"
                    >

                        <img
                            id="imagem-miniatura-4"
                            src=""
                            alt="Miniatura do produto 4"
                        >

                    </button>

                </div>

                <!-- IMAGEM PRINCIPAL -->

                <div
                    class="img-principal"
                    id="img-principal"
                >

                    <img
                        id="imagem-maior"
                        src=""
                        alt="Imagem principal do produto"
                    >

                </div>

            </div>

            <!-- ==================================
                 INFORMAÇÕES DO PRODUTO
            =================================== -->

            <div class="area-textos">

                <!-- SELO -->

                <span
                    class="selo-produto"
                    id="selo-produto"
                >
                    EDIÇÃO LIMITADA
                </span>

                <!-- NOME -->

                <h1 id="nome-produto"></h1>

                <!-- AVALIAÇÃO -->

                <div class="avaliacoes-produto">

                    <span
                        class="estrelas"
                        id="estrela-avaliacao"
                        aria-label="Avaliação do produto"
                    >
                    </span>

                    <span id="valor-avaliacao"></span>

                </div>

                <!-- PREÇOS -->

                <div class="area-precos">

                    <p id="preco-promocional"></p>

                    <p id="preco-antigo"></p>

                    <span id="desconto"></span>

                </div>

                <!-- DESCRIÇÃO -->

                <p
                    class="descricao-produto"
                    id="descricao-produto"
                ></p>

                <!-- CORES -->

                <div class="grupo-opcoes">

                    <p class="titulo-opcao">

                        COR:
                        <strong id="cor-selecionada"></strong>

                    </p>

                    <div
                        class="lista-cores"
                        id="cores"
                    >

                        <button
                            type="button"
                            class="opcao-cor"
                            id="cor-1"
                            data-indice="0"
                            aria-label="Selecionar primeira cor"
                        ></button>

                        <button
                            type="button"
                            class="opcao-cor"
                            id="cor-2"
                            data-indice="1"
                            aria-label="Selecionar segunda cor"
                        ></button>

                        <button
                            type="button"
                            class="opcao-cor"
                            id="cor-3"
                            data-indice="2"
                            aria-label="Selecionar terceira cor"
                        ></button>

                    </div>

                </div>

                <!-- TAMANHOS -->

                <div class="grupo-opcoes">

                    <p class="titulo-opcao">
                        TAMANHO
                    </p>

                    <div
                        class="lista-tamanhos"
                        id="tamanhos"
                    >

                        <button
                            type="button"
                            class="opcao-tamanho"
                            id="tamanho-1"
                            data-indice="0"
                        ></button>

                        <button
                            type="button"
                            class="opcao-tamanho"
                            id="tamanho-2"
                            data-indice="1"
                        ></button>

                        <button
                            type="button"
                            class="opcao-tamanho"
                            id="tamanho-3"
                            data-indice="2"
                        ></button>

                        <button
                            type="button"
                            class="opcao-tamanho"
                            id="tamanho-4"
                            data-indice="3"
                        ></button>

                    </div>

                </div>

                <!-- QUANTIDADE -->

                <div class="grupo-quantidade">

                    <p class="titulo-opcao">
                        QUANTIDADE
                    </p>

                    <div class="quantidade">

                        <button
                            type="button"
                            id="diminuir"
                            aria-label="Diminuir quantidade"
                        >
                            −
                        </button>

                        <span id="numero-quantidade">
                            1
                        </span>

                        <button
                            type="button"
                            id="aumentar"
                            aria-label="Aumentar quantidade"
                        >
                            +
                        </button>

                    </div>

                    <small id="estoque-disponivel"></small>

                </div>

                <!-- BOTÕES PRINCIPAIS -->

                <div class="acoes-produto">

                    <button
                        type="button"
                        id="btn-comprar"
                        class="btn-comprar-produto"
                    >
                        Comprar
                    </button>

                    <button
                        type="button"
                        id="btn-favoritar"
                        class="btn-favoritar"
                    >
                        <span id="icone-favorito">♡</span>

                        <span id="texto-favorito">
                            Favoritar
                        </span>

                    </button>

                </div>

                <button
                    type="button"
                    id="btn-add-carrinho"
                    class="btn-add-carrinho"
                >
                    Adicionar ao carrinho
                </button>

                <!-- FRETE -->

                <div class="area-frete">

                    <label for="frete">
                        Calcular o frete
                    </label>

                    <div class="frete-controle">

                        <input
                            type="text"
                            id="frete"
                            maxlength="9"
                            placeholder="00000-000"
                        >

                        <button
                            type="button"
                            id="btn-calcular-frete"
                        >
                            Calcular
                        </button>

                    </div>

                    <p id="resultado-frete"></p>

                </div>

            </div>

        </section>

    </main>

    <!-- CONEXÃO COM O JAVASCRIPT -->

    <script src="/js/produto.js"></script>

</body>

</html>
